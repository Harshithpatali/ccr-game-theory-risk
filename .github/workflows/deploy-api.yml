name: Deploy API
on:
 push:
  branches: [main]
permissions:
 id-token: write
 contents: read
env:
 AWS_REGION: ap-south-1
 ECR_REPOSITORY: ccr-game-theory-api
 ECS_CLUSTER: ccr-risk-cluster
 ECS_SERVICE: ccr-game-theory-api
jobs:
 deploy:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: aws-actions/configure-aws-credentials@v5
     with:
      role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      aws-region: ${{ env.AWS_REGION }}
   - id: login
     uses: aws-actions/amazon-ecr-login@v2
   - env:
      REGISTRY: ${{ steps.login.outputs.registry }}
      TAG: ${{ github.sha }}
     run: |
      docker build -f Dockerfile.api -t $REGISTRY/$ECR_REPOSITORY:$TAG .
      docker push $REGISTRY/$ECR_REPOSITORY:$TAG
   - run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment
